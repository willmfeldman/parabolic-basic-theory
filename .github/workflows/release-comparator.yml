name: Release comparator

# Release gate: run the toolchain's `lake comparator` on every challenges/*/config.json and upload an
# attestation (no external tool pins: the comparator ships with the toolchain).
# Dispatch it on the exact release commit; tag and publish a GitHub release only after it passes,
# with the attestation artifact attached. See challenges/README.md.
on:
  workflow_dispatch:
  # Release-candidate branches. Version tags don't trigger it: the tag goes on a commit whose dispatched
  # run already passed, so a tag-push run would only repeat it.
  push:
    branches: ['release/**']

jobs:
  comparator:
    # Automatic runs happen only in a public repository; a private copy runs this only when dispatched.
    if: github.event_name == 'workflow_dispatch' || github.event.repository.visibility == 'public'
    runs-on: ubuntu-latest
    timeout-minutes: 180   # PARAM: raise for large repos (up to 300)
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # Mathlib, the library, and the sandbox's copy of the repo do not fit in a hosted
      # runner's default free space. Remove preinstalled SDKs this job never uses.
      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      # Build the trusted library once, outside the sandbox. The challenge workspaces share its
      # dependency folder (`packagesDir`), which the comparator sandbox can read but not write.
      # `--no-cache`: tracked dependencies are built from source, never taken from prebuilt
      # release archives. The Mathlib cache is fetched separately and is not affected.
      - uses: leanprover/lean-action@v1
        with:
          use-mathlib-cache: true
          build: true
          build-args: "--no-cache"
          test: false
      - name: Remove downloaded Mathlib cache archives
        run: |
          rm -rf "$HOME/.cache/mathlib"
          df -h /
      - name: Validate challenge inventory and configuration
        run: ruby scripts/check-formalization-manifest.rb --metadata-only
      # bubblewrap, and unprivileged user namespaces (Ubuntu 24.04+ restricts them through AppArmor).
      - name: Prepare the comparator sandbox
        run: bash scripts/release-comparator.sh install
      # Lake writes `.hash` files the first time it replays some downloaded Mathlib artifacts,
      # which the sandbox cannot do. Building the trusted Challenge targets (and the Mathlib-only
      # Vocabulary modules, if any) here writes them first. Solution files are built only inside
      # the sandbox.
      - name: Build trusted Challenge targets outside the sandbox
        run: |
          for workspace in challenges/*/; do
            echo "==> ${workspace}Challenge"
            # A workspace without its own lakefile is built by the root lakefile.
            dir="$workspace"; [ -e "$workspace/lakefile.toml" ] || [ -e "$workspace/lakefile.lean" ] || dir=.
            (cd "$dir" && lake build Vocabulary Challenge)   # PARAM: `Vocabulary Challenge` (v1.4 Vocabulary modules)
          done
      # The checkout sits under /home, which the sandbox hides, so the script judges a copy in /srv.
      - name: Run lake comparator on every challenge
        env:
          COMPARATOR_PARANOID: "1"   # PARAM: "0" (Lean's kernel only) only with a recorded reason, e.g. timeout
        run: bash scripts/release-comparator.sh run
      - name: Upload Comparator attestation
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: comparator-attestation-${{ github.sha }}
          path: comparator-report/
          if-no-files-found: error
