name: Release comparator

on:
  workflow_dispatch:
  # Release candidates: release branches and version tags.
  push:
    branches: ['release/**']
    tags: ['v*']

jobs:
  comparator:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # Mathlib's build, the library, and Comparator's own Lean toolchain do
      # not fit in a hosted runner's default free space.  Remove preinstalled
      # SDKs this job never uses (the runner is discarded afterward).
      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      # Build the trusted library once, outside the sandbox.  The challenge
      # workspaces share its dependency folder (`packagesDir`), and Comparator's
      # sandbox can read but not write it, so everything must be prebuilt here.
      - uses: leanprover/lean-action@v1
        with:
          use-mathlib-cache: true
          build: true
          test: false
      # The downloaded Mathlib archives are already unpacked into
      # .lake/packages; nothing below reads them.
      - name: Remove downloaded Mathlib cache archives
        run: |
          rm -rf "$HOME/.cache/mathlib"
          df -h /
      - uses: actions/setup-go@v7
        with:
          go-version: '1.24.0'
      - name: Validate challenge inventory and configuration
        run: ruby scripts/check-formalization-manifest.rb --metadata-only
      - name: Install pinned Comparator tools
        run: bash scripts/release-comparator.sh install
      # Comparator's sandbox cannot write to the shared dependency folder, but
      # Lake writes `.hash` files the first time it replays some downloaded
      # Mathlib artifacts.  Building the trusted Challenge targets here writes
      # them first.  Solution files are still built only inside the sandbox.
      - name: Build trusted Challenge targets outside the sandbox
        run: |
          for workspace in challenges/*/; do
            echo "==> ${workspace}Challenge"
            (cd "$workspace" && lake build Challenge)
          done
      - name: Compare all external challenges
        run: bash scripts/release-comparator.sh run
      - name: Upload Comparator attestation
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: comparator-attestation-${{ github.sha }}
          path: comparator-report/
          if-no-files-found: error
