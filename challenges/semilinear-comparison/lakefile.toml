packagesDir = "../../.lake/packages"

[[require]]
name = "parabolic_basic_theory"
path = "../.."

[[lean_lib]]
name = "Vocabulary"

[[lean_lib]]
name = "Challenge"

[[lean_lib]]
name = "Solution"
